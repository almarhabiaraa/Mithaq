<!--
Reset Password page for the Mithaq platform.

Allows users who have received a password-reset link via email to set a
new password, completing the account recovery flow and restoring secure
access within the digital contract management system.
-->
{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ميثاق — تعيين كلمة مرور جديدة</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="{% static 'css/accountscss.css' %}" />
  </head>

  <body>
    <nav class="auth-navbar">
      <div class="nav-container">
        <a href="{% url 'home' %}" class="signin-back-link"><span>الرئيسية</span></a>

        <div class="nav-logo">
          <a href="{% url 'home' %}"><img src="{% static 'images/mithaq-logo.png' %}" alt="شعار ميثاق" class="logo-img" /></a>
        </div>
      </div>
    </nav>

    <div class="signin-page">
      <div class="signin-card">
        {% if messages %}
          {% for message in messages %}
            <div class="alert {{ message.extra_tags }}">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <h1 class="signin-title">تعيين كلمة مرور جديدة</h1>

        <p class="signin-subtitle">أدخل كلمة مرور قوية وآمنة لحسابك.</p>

        <form method="POST" id="resetPasswordForm">
          {% csrf_token %}

          <div class="signin-field">
            <label>كلمة المرور الجديدة</label>

            <div class="signin-input-wrapper">
              <input type="password" name="password" id="password" placeholder="••••••••••" required />

              <i class="bi bi-lock field-icon"></i>
            </div>
          </div>

          <div class="signin-field">
            <label>تأكيد كلمة المرور</label>

            <div class="signin-input-wrapper">
              <input type="password" name="confirm_password" id="confirmPassword" placeholder="••••••••••" required />

              <i class="bi bi-lock field-icon"></i>
            </div>
          </div>

          <p class="validation-text" id="passwordError"></p>

          <button type="submit" class="signin-btn">حفظ كلمة المرور الجديدة</button>
        </form>
      </div>
    </div>

    <script src="{% static 'js/reset_password.js' %}"></script>
  </body>
</html>
