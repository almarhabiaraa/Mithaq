<!-- 
User registration page for the Mithaq platform.

Handles new user account creation, identity information input,
authentication setup, and secure onboarding into the digital
contract management system.
-->
{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميثاق — إنشاء حساب</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/accountscss.css' %}">
</head>
<body>

    <!-- Navbar -->
    <nav class="auth-navbar">
        <div class="nav-container">
            <a href="{% url 'home' %}" class="signin-back-link">
                <span>الرئيسية</span>
            </a>
            <div class="nav-logo">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/mithaq-logo.png' %}" alt="شعار ميثاق" class="logo-img">
                </a>
            </div>
        </div>
    </nav>

    <!-- Page -->
    <div class="signin-page">
        <div class="signin-card">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert {{ message.extra_tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <h1 class="signin-title">إنشاء حساب جديد</h1>
            <p class="signin-subtitle">مرحباً بك، أنشئ حسابك للبدء</p>

            <form method="POST" action="{% url 'accounts:sign_up' %}">
                {% csrf_token %}

                <!-- الاسم الأول + اسم العائلة -->
                <div class="signup-row">
                    <div class="signin-field">
                        <label>الاسم الأول</label>
                        <div class="signin-input-wrapper">
                            <input type="text" name="first_name" placeholder="الاسم الأول" value="{{ form_data.first_name|default:'' }}" required>
                            <i class="bi bi-person field-icon"></i>
                        </div>
                    </div>
                    <div class="signin-field">
                        <label>اسم العائلة</label>
                        <div class="signin-input-wrapper">
                            <input type="text" name="last_name" placeholder="اسم العائلة" value="{{ form_data.last_name|default:'' }}" required>
                            <i class="bi bi-person field-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- البريد الإلكتروني -->
                <div class="signin-field">
                    <label>البريد الإلكتروني</label>
                    <div class="signin-input-wrapper">
                        <input type="email" name="email" placeholder="name@company.com" value="{{ form_data.email|default:'' }}" required>
                        <i class="bi bi-envelope field-icon"></i>
                    </div>
                </div>

                <!-- رقم الهوية -->
                <div class="signin-field">
                    <label>رقم الهوية / الإقامة</label>
                    <div class="signin-input-wrapper">
                        <input type="text" name="national_id" placeholder="رقم الهوية" value="{{ form_data.national_id|default:'' }}" required>
                        <i class="bi bi-card-text field-icon"></i>
                    </div>
                </div>

                <!-- رقم الجوال + تاريخ الميلاد -->
                <div class="signup-row">
                    <div class="signin-field">
                        <label>رقم الجوال</label>
                        <div class="signin-input-wrapper">
                            <input type="text" name="mobile" placeholder="05xxxxxxxx" value="{{ form_data.mobile|default:'' }}" required>
                            <i class="bi bi-phone field-icon"></i>
                        </div>
                    </div>
                    <div class="signin-field">
                        <label>تاريخ الميلاد</label>
                        <div class="signin-input-wrapper">
                            <input type="date" name="date_of_birth" value="{{ form_data.date_of_birth|default:'' }}">
                            <i class="bi bi-calendar field-icon"></i>
                        </div>
                    </div>
                </div>

                <!-- كلمة المرور -->
                <div class="signin-field">
                    <label>كلمة المرور</label>
                    <div class="signin-input-wrapper">
                        <input type="password" name="password" id="password" placeholder="••••••••••" required>
                        <i class="bi bi-lock field-icon"></i>
                        <i class="bi bi-eye-slash signin-toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <!-- تأكيد كلمة المرور -->
                <div class="signin-field">
                    <label>تأكيد كلمة المرور</label>
                    <div class="signin-input-wrapper">
                        <input type="password" name="confirm_password" id="confirmPassword" placeholder="••••••••••" required>
                        <i class="bi bi-lock field-icon"></i>
                        <i class="bi bi-eye-slash signin-toggle-password" id="toggleConfirmPassword"></i>
                    </div>
                </div>

                <button type="submit" class="signin-btn">إنشاء حساب</button>

            </form>

            <p class="signin-bottom-link">
                تملك حساباً؟
                <a href="{% url 'accounts:sign_in' %}">تسجيل الدخول</a>
            </p>

            <p class="signin-trust">
                <i class="bi bi-shield-check"></i>
                بياناتك محمية وآمنة لدينا
            </p>

        </div>
    </div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        const input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
        this.classList.toggle('bi-eye-slash');
        this.classList.toggle('bi-eye');
    });

    document.getElementById('toggleConfirmPassword').addEventListener('click', function () {
        const input = document.getElementById('confirmPassword');
        input.type = input.type === 'password' ? 'text' : 'password';
        this.classList.toggle('bi-eye-slash');
        this.classList.toggle('bi-eye');
    });
</script>

</body>
</html>
